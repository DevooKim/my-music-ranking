worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format cache '$remote_addr [$time_iso8601] "$request" $status '
                   'cache=$cache_status bytes=$body_bytes_sent';
  access_log /var/log/nginx/access.log cache;
  error_log /var/log/nginx/error.log warn;

  proxy_cache_path /var/cache/nginx/chart levels=1:2 keys_zone=chart_cache:32m
                   max_size=2g inactive=30d use_temp_path=off;
  proxy_cache_path /var/cache/nginx/assets levels=1:2 keys_zone=asset_cache:8m
                   max_size=256m inactive=365d use_temp_path=off;

  map $request_method $skip_method { default 1; GET 0; HEAD 0; }
  map $request_uri $skip_path {
    default 0;
    ~^/api/revalidate(?:$|/) 1;
    ~^/api/health(?:$|/) 1;
    ~^/api/artist-thumbnails(?:$|/) 1;
    ~^/sw\.js(?:$|\?) 1;
  }
  map $http_rsc $skip_rsc { default 0; "1" 1; }
  map $http_accept $skip_accept { default 0; ~*text/x-component 1; }
  map $http_next_router_prefetch $skip_router_prefetch { default 1; "" 0; }
  map $http_next_router_state_tree $skip_router_state { default 1; "" 0; }
  map $http_purpose $skip_purpose { default 0; ~*prefetch 1; }
  map $http_cookie $skip_cookie { default 1; "" 0; }
  map $http_authorization $skip_auth { default 1; "" 0; }
  map $http_upgrade $skip_upgrade { default 1; "" 0; }
  map "$skip_method$skip_path$skip_rsc$skip_accept$skip_router_prefetch$skip_router_state$skip_purpose$skip_cookie$skip_auth$skip_upgrade" $cache_skip {
    default 1;
    "0000000000" 0;
  }

  map $upstream_http_set_cookie $skip_set_cookie { default 1; "" 0; }
  map $upstream_http_cache_control $skip_response_cache {
    default 0;
    ~*no-store 1;
    ~*private 1;
  }
  map $upstream_status $skip_status {
    default 0;
    404 0;
    ~^4 1;
    ~^5 1;
  }
  map "$cache_skip:$upstream_cache_status" $cache_status {
    default $upstream_cache_status;
    "1:" BYPASS;
    "0:" MISS;
  }
  map $upstream_status $html_cache_control {
    default "no-store";
    200 "public, max-age=0, s-maxage=300";
    404 "public, max-age=0, s-maxage=120";
  }

  limit_req_zone $binary_remote_addr zone=artist_thumbnail_limit:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=revalidate_limit:10m rate=5r/m;

  upstream next_web { server web:3000; }

  server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 32k;
    add_header X-Cache-Status $cache_status always;
    proxy_cache_bypass $cache_skip;
    proxy_no_cache $cache_skip $skip_set_cookie $skip_response_cache $skip_status;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_cache_key "$scheme|$request_method|$host|$request_uri|$http_accept|$http_accept_encoding";
    proxy_hide_header X-Accel-Expires;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_background_update on;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    location = /healthz {
      access_log off;
      add_header Cache-Control no-store always;
      return 200 "ok\n";
    }

    location = /_next/static/ {
      return 404;
    }
    location ^~ /_next/static/ {
      proxy_pass http://next_web;
      proxy_cache asset_cache;
      proxy_cache_valid 200 365d;
      proxy_cache_valid 404 2m;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /sw.js {
      proxy_pass http://next_web;
      proxy_cache off;
      add_header Cache-Control "no-store" always;
    }

    location = /api/revalidate {
      limit_req zone=revalidate_limit burst=2 nodelay;
      proxy_pass http://next_web;
      proxy_cache off;
      proxy_no_cache 1;
      add_header Cache-Control no-store always;
    }
    location = /api/artist-thumbnails {
      limit_req zone=artist_thumbnail_limit burst=5 nodelay;
      proxy_pass http://next_web;
      proxy_cache off;
      proxy_no_cache 1;
      add_header Cache-Control no-store always;
    }

    location = /api/charts/weekly/latest {
      proxy_pass http://next_web;
      proxy_cache chart_cache;
      proxy_cache_valid 200 5m;
      proxy_cache_valid 404 2m;
    }
    # Next dynamic HTML emits private/no-store. Only these allowlisted chart
    # locations override that upstream metadata; skip predicates and status/
    # Set-Cookie guards remain active.
    location = / {
      proxy_pass http://next_web;
      proxy_cache chart_cache;
      proxy_cache_valid 200 5m;
      proxy_cache_valid 404 2m;
      proxy_ignore_headers Cache-Control Expires;
      proxy_hide_header Cache-Control;
      proxy_hide_header Expires;
      proxy_no_cache $cache_skip $skip_set_cookie $skip_status;
      add_header X-Cache-Status $cache_status always;
      add_header Cache-Control $html_cache_control always;
    }
    location ^~ /api/charts/ {
      proxy_pass http://next_web;
      proxy_cache chart_cache;
      proxy_cache_valid 200 30d;
      proxy_cache_valid 404 2m;
    }
    # These dynamic HTML namespaces include the current period, so keep the
    # whole namespace at the safe 5-minute TTL. Historical chart APIs below
    # still use the 30-day policy.
    location ~ ^/(weekly|monthly|yearly)(?:/|$) {
      proxy_pass http://next_web;
      proxy_cache chart_cache;
      proxy_cache_valid 200 5m;
      proxy_cache_valid 404 2m;
      proxy_ignore_headers Cache-Control Expires;
      proxy_hide_header Cache-Control;
      proxy_hide_header Expires;
      proxy_no_cache $cache_skip $skip_set_cookie $skip_status;
      add_header X-Cache-Status $cache_status always;
      add_header Cache-Control $html_cache_control always;
    }
    location / {
      proxy_pass http://next_web;
      proxy_cache chart_cache;
      proxy_cache_valid 200 5m;
      proxy_cache_valid 404 2m;
    }
  }
}
