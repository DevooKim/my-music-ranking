AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Music Ranking Lambda Functions

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs22.x
    Architectures:
      - arm64
    MemorySize: 256
    Environment:
      Variables:
        S3_BUCKET: !Ref S3BucketName
        S3_REGION: !Ref AWS::Region

Parameters:
  S3BucketName:
    Type: String
    Default: my-music-ranking
    Description: Existing S3 bucket name for storing music data
  SpotifyClientId:
    Type: String
    NoEcho: true
  SpotifyClientSecret:
    Type: String
    NoEcho: true
  SpotifyRefreshToken:
    Type: String
    NoEcho: true

Resources:

  # 2시간마다 Spotify 재생 기록 수집
  CollectorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - collector/handler.ts
    Properties:
      CodeUri: .
      Handler: handler.handler
      Description: Collect Spotify recently played tracks
      Environment:
        Variables:
          SPOTIFY_CLIENT_ID: !Ref SpotifyClientId
          SPOTIFY_CLIENT_SECRET: !Ref SpotifyClientSecret
          SPOTIFY_REFRESH_TOKEN: !Ref SpotifyRefreshToken
      Policies:
        - S3WritePolicy:
            BucketName: !Ref S3BucketName
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: cron(0 0/2 * * ? *)

  # 매주 월요일: raw 병합 + 주간 차트 생성
  WeeklyProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - weekly-processor/handler.ts
    Properties:
      CodeUri: .
      Handler: handler.handler
      Description: Merge weekly raw data and generate weekly chart
      Timeout: 120
      MemorySize: 512
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref S3BucketName
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            # 매주 월요일 00:30 KST (일요일 15:30 UTC)
            Schedule: cron(30 15 ? * SUN *)

  # 매월 1일: 월간 차트 생성
  MonthlyProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - monthly-processor/handler.ts
    Properties:
      CodeUri: .
      Handler: handler.handler
      Description: Generate monthly chart
      Timeout: 120
      MemorySize: 512
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref S3BucketName
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            # 매월 1일 01:00 KST (전날 16:00 UTC)
            Schedule: cron(0 16 L * ? *)

Outputs:
  S3BucketName:
    Value: !Ref S3BucketName
  CollectorFunctionArn:
    Value: !GetAtt CollectorFunction.Arn
  WeeklyProcessorFunctionArn:
    Value: !GetAtt WeeklyProcessorFunction.Arn
  MonthlyProcessorFunctionArn:
    Value: !GetAtt MonthlyProcessorFunction.Arn
