AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Music Ranking Lambda Functions
Globals:
  Function:
    Timeout: 30
    Runtime: nodejs22.x
    Architectures:
    - arm64
    MemorySize: 256
    Environment:
      Variables:
        S3_BUCKET:
          Ref: S3Bucket
        S3_REGION:
          Ref: AWS::Region
Parameters:
  SpotifyClientId:
    Type: String
    NoEcho: true
  SpotifyClientSecret:
    Type: String
    NoEcho: true
  SpotifyRefreshToken:
    Type: String
    NoEcho: true
Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: my-music-ranking
  CollectorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - collector/handler.ts
        Minify: true
        Sourcemap: true
        Target: es2022
      SamResourceId: CollectorFunction
    Properties:
      CodeUri: CollectorFunction
      Handler: handler.handler
      Description: Collect Spotify recently played tracks
      Environment:
        Variables:
          SPOTIFY_CLIENT_ID:
            Ref: SpotifyClientId
          SPOTIFY_CLIENT_SECRET:
            Ref: SpotifyClientSecret
          SPOTIFY_REFRESH_TOKEN:
            Ref: SpotifyRefreshToken
          NODE_OPTIONS: ' --enable-source-maps'
      Policies:
      - S3WritePolicy:
          BucketName:
            Ref: S3Bucket
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: rate(2 hours)
  WeeklyProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - weekly-processor/handler.ts
        Minify: true
        Sourcemap: true
        Target: es2022
      SamResourceId: WeeklyProcessorFunction
    Properties:
      CodeUri: WeeklyProcessorFunction
      Handler: handler.handler
      Description: Merge weekly raw data and generate weekly chart
      Timeout: 120
      MemorySize: 512
      Policies:
      - S3CrudPolicy:
          BucketName:
            Ref: S3Bucket
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: cron(30 15 ? * SUN *)
      Environment:
        Variables:
          NODE_OPTIONS: ' --enable-source-maps'
  MonthlyProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - monthly-processor/handler.ts
        Minify: true
        Sourcemap: true
        Target: es2022
      SamResourceId: MonthlyProcessorFunction
    Properties:
      CodeUri: MonthlyProcessorFunction
      Handler: handler.handler
      Description: Generate monthly chart
      Timeout: 120
      MemorySize: 512
      Policies:
      - S3CrudPolicy:
          BucketName:
            Ref: S3Bucket
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: cron(0 16 L * ? *)
      Environment:
        Variables:
          NODE_OPTIONS: ' --enable-source-maps'
Outputs:
  S3BucketName:
    Value:
      Ref: S3Bucket
  CollectorFunctionArn:
    Value:
      Fn::GetAtt:
      - CollectorFunction
      - Arn
  WeeklyProcessorFunctionArn:
    Value:
      Fn::GetAtt:
      - WeeklyProcessorFunction
      - Arn
  MonthlyProcessorFunctionArn:
    Value:
      Fn::GetAtt:
      - MonthlyProcessorFunction
      - Arn
